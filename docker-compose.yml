services:
  users-service-api:
    build:
      context: ./users-service
      dockerfile: Dockerfile
    container_name: serveio-users-service
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@userservice-db:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      userservice-db:
        condition: service_healthy
    networks:
      - serveio-network

  userservice-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - serveio-network

  restaurant-service-api:
    build:
      context: ./resturant-service
      dockerfile: Dockerfile
    container_name: serveio-restaurant-service
    env_file:
      - .env
    environment:
      PORT: ${RESTAURANT_PORT:-3001}
      DATABASE_URL: postgresql://${RESTAURANT_USER}:${RESTAURANT_PASSWORD}@restaurantservice-db:5432/${RESTAURANT_DB}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
    ports:
      - "${RESTAURANT_PORT:-3001}:${RESTAURANT_PORT:-3001}"
    depends_on:
      restaurantservice-db:
        condition: service_healthy
    networks:
      - serveio-network

  restaurantservice-db:
    image: postgres:16-alpine
    container_name: serveio-restaurant-db
    environment:
      POSTGRES_DB: ${RESTAURANT_DB}
      POSTGRES_USER: ${RESTAURANT_USER}
      POSTGRES_PASSWORD: ${RESTAURANT_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - restaurant_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RESTAURANT_USER} -d ${RESTAURANT_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - serveio-network

  cart-service-api:
    build:
      context: ./cart-service
      dockerfile: Dockerfile
    container_name: serveio-cart-service
    env_file:
      - .env
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://${CART_USER}:${CART_PASSWORD}@cartservice-db:5432/${CART_DB}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
    ports:
      - "3002:3002"
    depends_on:
      cartservice-db:
        condition: service_healthy
    networks:
      - serveio-network
  cartservice-db:
    image: postgres:16-alpine
    container_name: serveio-cart-db
    environment:
      POSTGRES_DB: ${CART_DB}
      POSTGRES_USER: ${CART_USER}
      POSTGRES_PASSWORD: ${CART_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - cart_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CART_USER} -d ${CART_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - serveio-network


  order-service-api:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: serveio-order-service
    env_file:
      - .env
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://${ORDER_USER}:${ORDER_PASSWORD}@orderservice-db:5432/${ORDER_DB}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3003:3003"
    depends_on:
      redis:
        condition: service_healthy
      orderservice-db:
        condition: service_healthy
    networks:
      - serveio-network

  orderservice-db:
    image: postgres:16-alpine
    container_name: serveio-order-db
    environment:
      POSTGRES_DB: ${ORDER_DB}
      POSTGRES_USER: ${ORDER_USER}
      POSTGRES_PASSWORD: ${ORDER_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - orderservice_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_USER} -d ${ORDER_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - serveio-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: serveio-notification-service
    env_file:
      - .env
    environment:
      PORT: 3004
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_NAME: order-events
      NODE_ENV: development
    ports:
      - "3004:3004"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - serveio-network
  redis:
    image: redis:7-alpine
    container_name: serveio-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - serveio-network

networks:
  serveio-network:
    driver: bridge
volumes:
  db_data:
  restaurant_db_data:
  cart_db_data:
  redis_data:
  orderservice_db_data:
