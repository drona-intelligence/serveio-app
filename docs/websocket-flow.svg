<svg width="680" viewBox="0 0 680 360" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; background: transparent;">
  <title>WebSocket Real-time Notification Flow</title>
  <desc>Frontend clients connect to notification-service via Socket.IO, join user or admin rooms, and receive real-time order events.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- serveio-frontend -->
  <rect x="40" y="44" width="148" height="66" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" fill="#0C447C" x="114" y="70" text-anchor="middle" dominant-baseline="central">serveio-frontend</text>
  <text font-size="12" fill="#185FA5" x="114" y="92" text-anchor="middle" dominant-baseline="central">React + Vite client</text>

  <!-- Arrow: frontend → notification-service -->
  <path d="M188 77 L268 77" fill="none" stroke="#378ADD" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text font-size="12" fill="#185FA5" x="228" y="68" text-anchor="middle">connect</text>

  <!-- notification-service -->
  <rect x="270" y="44" width="176" height="66" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" fill="#085041" x="358" y="70" text-anchor="middle" dominant-baseline="central">notification-service</text>
  <text font-size="12" fill="#0F6E56" x="358" y="92" text-anchor="middle" dominant-baseline="central">Socket.IO server · :3004</text>

  <!-- Arrow: BullMQ consumer → notification-service -->
  <path d="M358 168 L358 110" fill="none" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text font-size="12" fill="#0F6E56" x="402" y="148" text-anchor="start">processed event</text>

  <!-- BullMQ consumer -->
  <rect x="270" y="168" width="176" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" fill="#712B13" x="358" y="192" text-anchor="middle" dominant-baseline="central">BullMQ consumer</text>
  <text font-size="12" fill="#993C1D" x="358" y="210" text-anchor="middle" dominant-baseline="central">Listens on order-events</text>

  <!-- user room -->
  <rect x="492" y="30" width="148" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" fill="#3C3489" x="566" y="54" text-anchor="middle" dominant-baseline="central">user room</text>
  <text font-size="12" fill="#534AB7" x="566" y="72" text-anchor="middle" dominant-baseline="central">Joined by customer</text>

  <!-- admin room -->
  <rect x="492" y="110" width="148" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" fill="#633806" x="566" y="134" text-anchor="middle" dominant-baseline="central">admin room</text>
  <text font-size="12" fill="#854F0B" x="566" y="152" text-anchor="middle" dominant-baseline="central">Joined by admin</text>

  <!-- Arrows: notification-service → rooms -->
  <path d="M446 65 L490 58" fill="none" stroke="#7F77DD" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M446 77 L490 138" fill="none" stroke="#BA7517" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Events legend -->
  <rect x="40" y="268" width="600" height="72" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" fill="#2C2C2A" x="60" y="290" dominant-baseline="central">Events emitted</text>
  <!-- event pill 1 -->
  <rect x="60" y="300" width="120" height="24" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.4"/>
  <text font-size="12" fill="#3C3489" x="120" y="312" text-anchor="middle" dominant-baseline="central">order:created</text>
  <!-- event pill 2 -->
  <rect x="196" y="300" width="165" height="24" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.4"/>
  <text font-size="12" fill="#085041" x="279" y="312" text-anchor="middle" dominant-baseline="central">order:status_updated</text>

  <!-- Register room dashed arrow (frontend → rooms) -->
  <path d="M114 110 L114 250 L530 250 L530 224" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text font-size="12" fill="#888780" x="300" y="244" text-anchor="middle">register with room on connect</text>
</svg>
