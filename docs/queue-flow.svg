<svg width="680" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif; background: transparent;">
  <title>BullMQ Order Event Queue Flow</title>
  <desc>order-service publishes order events to a BullMQ queue backed by Redis, which notification-service consumes independently.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- order-service -->
  <rect x="40" y="110" width="148" height="66" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" fill="#3C3489" x="114" y="136" text-anchor="middle" dominant-baseline="central">order-service</text>
  <text font-size="12" fill="#534AB7" x="114" y="158" text-anchor="middle" dominant-baseline="central">Creates &amp; persists orders</text>

  <!-- Arrow: order-service → Redis -->
  <line x1="188" y1="143" x2="254" y2="143" stroke="#7F77DD" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text font-size="12" fill="#534AB7" x="221" y="134" text-anchor="middle">publish</text>

  <!-- Redis / BullMQ Queue -->
  <rect x="256" y="90" width="168" height="106" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" fill="#712B13" x="340" y="120" text-anchor="middle" dominant-baseline="central">Redis + BullMQ</text>
  <text font-size="12" fill="#993C1D" x="340" y="141" text-anchor="middle" dominant-baseline="central">Queue: order-events</text>
  <!-- Job pills -->
  <rect x="280" y="154" width="120" height="12" rx="4" fill="#F0997B" fill-opacity="0.3" stroke="#D85A30" stroke-width="0.3"/>
  <rect x="284" y="157" width="48" height="6" rx="3" fill="#D85A30" fill-opacity="0.5"/>
  <rect x="340" y="157" width="36" height="6" rx="3" fill="#D85A30" fill-opacity="0.4"/>
  <rect x="284" y="165" width="60" height="6" rx="3" fill="#D85A30" fill-opacity="0.3"/>
  <rect x="352" y="165" width="28" height="6" rx="3" fill="#D85A30" fill-opacity="0.35"/>
  <rect x="280" y="173" width="120" height="10" rx="4" fill="#F0997B" fill-opacity="0.15" stroke="#D85A30" stroke-width="0.3"/>

  <!-- Arrow: Redis → notification-service -->
  <line x1="424" y1="143" x2="490" y2="143" stroke="#1D9E75" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text font-size="12" fill="#0F6E56" x="457" y="134" text-anchor="middle">consume</text>

  <!-- notification-service -->
  <rect x="492" y="110" width="148" height="66" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" fill="#085041" x="566" y="136" text-anchor="middle" dominant-baseline="central">notification-service</text>
  <text font-size="12" fill="#0F6E56" x="566" y="158" text-anchor="middle" dominant-baseline="central">Processes events async</text>

  <!-- Decoupling label -->
  <text font-size="12" fill="#888780" x="340" y="230" text-anchor="middle">Order creation and notification delivery are fully decoupled</text>

  <!-- Port labels -->
  <text font-size="12" fill="#888780" x="114" y="190" text-anchor="middle">:3003</text>
  <text font-size="12" fill="#888780" x="566" y="190" text-anchor="middle">:3004</text>
</svg>
